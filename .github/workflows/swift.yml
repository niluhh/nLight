name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build nLight (macOS)
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Build (Debug)
        run: |
          xcodebuild build \
            -project nLight.xcodeproj \
            -scheme nLight \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ONLY_ACTIVE_ARCH=YES

      - name: Build (Release)
        run: |
          xcodebuild build \
            -project nLight.xcodeproj \
            -scheme nLight \
            -configuration Release \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CONFIGURATION_BUILD_DIR=$PWD/build/Release

      - name: Package app bundle
        run: |
          cd build/Release
          zip -r --symlinks ../../nLight.zip nLight.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nLight-app
          path: nLight.zip
          if-no-files-found: error
